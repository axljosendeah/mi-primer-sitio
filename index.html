<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator Interactivo</title>
    <style>
        body {
            background-color: #0f172a; /* Fondo oscuro estilo videojuego */
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background-color: #1e293b;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .chat-header {
            background-color: #3b82f6; /* Azul Akinator */
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.bot {
            background-color: #475569;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background-color: #2563eb;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #0f172a;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #334155;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid #3b82f6; }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🧙‍♂️ El Genio Adivino</div>
        
        <!-- Historial de mensajes -->
        <div class="chat-messages" id="historial-chat">
            <div class="message bot">¡Hola! Soy el genio adivino. Piensa en algo, salúdame y dime tu primera pista. Intentaré adivinarlo...</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="mensaje-usuario" placeholder="Escribe tu saludo o pista aquí..." autocomplete="off">
            <button id="btn-enviar">Enviar</button>
        </div>
    </div>

    <script>
        const btnEnviar = document.getElementById('btn-enviar');
        const inputUsuario = document.getElementById('mensaje-usuario');
        const historialChat = document.getElementById('historial-chat');
        
        // 🚨 CAMBIA ESTA URL POR LA URL REAL DE TU BACKEND EN RENDER (Sin barra '/' al final)
        const BACKEND_URL = "https://mi-primer-sitio-v2.onrender.com";

        // Llevamos la cuenta de cuántas respuestas del genio hemos dibujado en pantalla
        let respuestasMostradas = 0;

        async function enviarMensaje() {
            const texto = inputUsuario.value.trim();
            if (texto === "") return;

            // 1. Mostrar de inmediato el mensaje en la pantalla del usuario
            const nuevaBurbuja = document.createElement('div');
            nuevaBurbuja.className = 'message user';
            nuevaBurbuja.textContent = texto;
            historialChat.appendChild(nuevaBurbuja);
            
            inputUsuario.value = "";
            historialChat.scrollTop = historialChat.scrollHeight;

            // 2. Enviar el mensaje al servidor de FastAPI
            try {
                await fetch(`${BACKEND_URL}/enviar-pista`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
            }
        }

        // 3. Revisar en el backend si el administrador respondió
        async function traerRespuestas() {
            try {
                const res = await fetch(`${BACKEND_URL}/actualizar-partida`);
                if (!res.ok) return;

                const datos = await res.json();
                
                // Si hay más respuestas registradas en el servidor de las que ya dibujamos
                if (datos.respuestas_genio && datos.respuestas_genio.length > respuestasMostradas) {
                    for (let i = respuestasMostradas; i < datos.respuestas_genio.length; i++) {
                        const nuevaBurbujaBot = document.createElement('div');
                        nuevaBurbujaBot.className = 'message bot';
                        nuevaBurbujaBot.textContent = datos.respuestas_genio[i];
                        historialChat.appendChild(nuevaBurbujaBot);
                    }
                    // Actualizar el contador de mensajes mostrados
                    respuestasMostradas = datos.respuestas_genio.length;
                    historialChat.scrollTop = historialChat.scrollHeight;
                }
            } catch (error) {
                console.error("Error al consultar actualización:", error);
            }
        }

        // Consultar nuevas respuestas cada 2 segundos
        setInterval(traerRespuestas, 2000);

        // Eventos para enviar con clic o con la tecla Enter
        btnEnviar.addEventListener('click', enviarMensaje);
        inputUsuario.addEventListener('keydown', function(e) { 
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarMensaje();
            }
        });
    </script>
</body>
</html>

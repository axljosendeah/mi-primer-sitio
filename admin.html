<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Secreto del Genio (Admin)</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', sans-serif;
            margin: 20px;
            color: white;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 { color: #f59e0b; margin: 0; font-size: 1.5rem; }
        .btn-reset {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-reset:hover { background-color: #dc2626; }
        .info-panel {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .info-panel p { margin: 5px 0; }
        .info-panel span { color: #10b981; font-weight: bold; }
        .messages-log {
            background-color: #0f172a;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .log-item { padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; word-wrap: break-word; }
        .log-item.user-text { background-color: rgba(37, 99, 235, 0.2); border-left: 4px solid #2563eb; }
        .log-item.my-text { background-color: rgba(245, 158, 11, 0.2); border-left: 4px solid #f59e0b; }
        .reply-area { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #334155;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid #f59e0b; }
        .btn-send {
            background-color: #f59e0b;
            color: black;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-send:hover { background-color: #d97706; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-panel">
            <h1>🧙‍♂️ Consola Secreta del Genio</h1>
            <button class="btn-reset" id="btn-reiniciar">Reiniciar Juego</button>
        </div>
        
        <!-- Panel de información técnica del jugador -->
        <div class="info-panel">
            <p>🌐 IP del Jugador: <span id="ip-jugador">Cargando...</span></p>
            <p>📍 Ubicación Estimada: <span id="ubicacion-jugador">Cargando...</span></p>
        </div>

        <h3>💬 Historial de Pistas en Tiempo Real</h3>
        <div class="messages-log" id="registro-mensajes">
            <div class="log-item my-text"><b>Tú (Genio):</b> ¡Hola! Soy el genio adivino...</div>
        </div>

        <h3>✍️ Enviar Siguiente Opción o Adivinanza</h3>
        <div class="reply-area">
            <input type="text" id="respuesta-admin" placeholder="Escribe las opciones (ej: ¿Es un animal?, ¿Es de color verde?)..." autocomplete="off">
            <button class="btn-send" id="btn-responder">Enviar al Chat</button>
        </div>
    </div>

    <script>
        // ✅ CORREGIDO: apuntando al Web Service de FastAPI (mi-primer-servidor-python),
        // NO al Static Site (mi-primer-sitio-v2) que es este mismo panel.
        // Verifica el nombre exacto en el dashboard de Render (puede tener un sufijo, ej. -xxxx).
        const BACKEND_URL = "https://mi-primer-servidor-python.onrender.com";

        const ipElement = document.getElementById('ip-jugador');
        const ubicacionElement = document.getElementById('ubicacion-jugador');
        const registroMensajes = document.getElementById('registro-mensajes');
        const inputRespuesta = document.getElementById('respuesta-admin');
        const btnResponder = document.getElementById('btn-responder');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        let mensajesUsuarioMostrados = 0;
        let respuestasGenioMostradas = 0;

        // 1. Consultar constantemente el estado de la partida
        async function monitorearPartida() {
            try {
                const res = await fetch(`${BACKEND_URL}/actualizar-partida`);
                if (!res.ok) return;

                const datos = await res.json();

                // Actualizar IP y Ubicación
                ipElement.innerText = datos.ip || "No detectada";
                ubicacionElement.innerText = datos.ubicacion || "Desconocida";

                // Mostrar nuevos mensajes del jugador
                if (datos.mensajes_usuario && datos.mensajes_usuario.length > mensajesUsuarioMostrados) {
                    for (let i = mensajesUsuarioMostrados; i < datos.mensajes_usuario.length; i++) {
                        const nuevoLog = document.createElement('div');
                        nuevoLog.className = 'log-item user-text';
                        nuevoLog.innerHTML = `<b>Jugador:</b> ${datos.mensajes_usuario[i]}`;
                        registroMensajes.appendChild(nuevoLog);
                    }
                    mensajesUsuarioMostrados = datos.mensajes_usuario.length;
                    registroMensajes.scrollTop = registroMensajes.scrollHeight;
                }

                // Mostrar nuevas respuestas enviadas por el admin
                if (datos.respuestas_genio && datos.respuestas_genio.length > respuestasGenioMostradas) {
                    for (let i = respuestasGenioMostradas; i < datos.respuestas_genio.length; i++) {
                        const nuevoLog = document.createElement('div');
                        nuevoLog.className = 'log-item my-text';
                        nuevoLog.innerHTML = `<b>Tú (Genio):</b> ${datos.respuestas_genio[i]}`;
                        registroMensajes.appendChild(nuevoLog);
                    }
                    respuestasGenioMostradas = datos.respuestas_genio.length;
                    registroMensajes.scrollTop = registroMensajes.scrollHeight;
                }

            } catch (error) {
                console.error("Error consultando el servidor:", error);
            }
        }

        // 2. Enviar respuesta al jugador
        async function enviarRespuesta() {
            const texto = inputRespuesta.value.trim();
            if (texto === "") return;

            try {
                await fetch(`${BACKEND_URL}/enviar-respuesta`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });
                inputRespuesta.value = "";
                monitorearPartida(); // Forzar actualización rápida
            } catch (error) {
                console.error("Error al enviar la respuesta:", error);
            }
        }

        // 3. Reiniciar la partida
        async function reiniciarPartida() {
            if (!confirm("¿Estás seguro de que deseas reiniciar la partida actual?")) return;

            try {
                await fetch(`${BACKEND_URL}/reiniciar`, { method: 'POST' });
                
                // Limpiar pantalla local
                mensajesUsuarioMostrados = 0;
                respuestasGenioMostradas = 0;
                registroMensajes.innerHTML = '<div class="log-item my-text"><b>Tú (Genio):</b> ¡Hola! Soy el genio adivino...</div>';
                ipElement.innerText = "No detectada";
                ubicacionElement.innerText = "Desconocida";
            } catch (error) {
                console.error("Error al reiniciar:", error);
            }
        }

        // Ejecutar monitoreo cada 2 segundos
        setInterval(monitorearPartida, 2000);

        // Listeners
        btnResponder.addEventListener('click', enviarRespuesta);
        btnReiniciar.addEventListener('click', reiniciarPartida);
        inputRespuesta.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarRespuesta();
            }
        });
    </script>
</body>
</html>
